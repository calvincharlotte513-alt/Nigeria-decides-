<svg width="1920" height="1080" viewBox="0 0 1920 1080" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Base Atmospheric Gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#fbf7ff" />
      <stop offset="30%" stopColor="#f6effe" />
      <stop offset="65%" stopColor="#f3faff" />
      <stop offset="100%" stopColor="#faf5ff" />
    </linearGradient>

    <!-- Radial Glows -->
    <radialGradient id="greenGlow" cx="15%" cy="20%" r="40%">
      <stop offset="0%" stopColor="#10b981" stopOpacity="0.14" />
      <stop offset="60%" stopColor="#10b981" stopOpacity="0.03" />
      <stop offset="100%" stopColor="#10b981" stopOpacity="0" />
    </radialGradient>

    <radialGradient id="purpleGlow" cx="85%" cy="15%" r="45%">
      <stop offset="0%" stopColor="#a855f7" stopOpacity="0.18" />
      <stop offset="50%" stopColor="#ec4899" stopOpacity="0.08" />
      <stop offset="100%" stopColor="#a855f7" stopOpacity="0" />
    </radialGradient>

    <radialGradient id="goldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stopColor="#f59e0b" stopOpacity="0.10" />
      <stop offset="60%" stopColor="#fbbf24" stopOpacity="0.02" />
      <stop offset="100%" stopColor="#f59e0b" stopOpacity="0" />
    </radialGradient>

    <radialGradient id="centerGlow" cx="50%" cy="85%" r="45%">
      <stop offset="0%" stopColor="#8b2fc9" stopOpacity="0.12" />
      <stop offset="100%" stopColor="#8b2fc9" stopOpacity="0" />
    </radialGradient>

    <!-- Linear Gradients for Shapes -->
    <linearGradient id="ribbon1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#10b981" stopOpacity="0.25" />
      <stop offset="50%" stopColor="#ffffff" stopOpacity="0.4" />
      <stop offset="100%" stopColor="#10b981" stopOpacity="0.25" />
    </linearGradient>

    <linearGradient id="ribbon2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#8b2fc9" stopOpacity="0.2" />
      <stop offset="50%" stopColor="#e040fb" stopOpacity="0.25" />
      <stop offset="100%" stopColor="#f59e0b" stopOpacity="0.15" />
    </linearGradient>
  </defs>

  <!-- Sky Base -->
  <rect width="1920" height="1080" fill="url(#skyGrad)" />

  <!-- Ambient Light Orbs -->
  <rect width="1920" height="1080" fill="url(#greenGlow)" />
  <rect width="1920" height="1080" fill="url(#purpleGlow)" />
  <rect width="1920" height="1080" fill="url(#goldGlow)" />
  <rect width="1920" height="1080" fill="url(#centerGlow)" />

  <!-- Subtle Playful Geometric Grid Dots -->
  <g opacity="0.04" fill="#6b21a8">
    <pattern id="dotPattern" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.5" />
    </pattern>
    <rect width="1920" height="1080" fill="url(#dotPattern)" />
  </g>

  <!-- Flowing Playful Streamer Ribbons Across Background -->
  <path d="M-100 280 C 300 120, 600 420, 1100 240 C 1500 100, 1800 320, 2050 200" stroke="url(#ribbon1)" stroke-width="40" fill="none" stroke-linecap="round" opacity="0.3" filter="blur(8px)" />
  <path d="M-100 310 C 300 150, 600 450, 1100 270 C 1500 130, 1800 350, 2050 230" stroke="url(#ribbon2)" stroke-width="24" fill="none" stroke-linecap="round" opacity="0.35" filter="blur(6px)" />
  <path d="M-100 850 C 450 720, 850 960, 1350 780 C 1700 660, 1950 820, 2050 750" stroke="url(#ribbon1)" stroke-width="32" fill="none" stroke-linecap="round" opacity="0.25" filter="blur(10px)" />

  <!-- Subtle Silhouettes of Nigerian Landmarks (Aso Rock, Zuma Rock, Lekki Bridge & City Skyline) -->
  <g opacity="0.045" fill="#3b0764">
    <!-- Zuma Rock Silhouette left -->
    <path d="M 80 1080 L 120 920 C 160 840, 280 820, 360 850 C 420 870, 460 920, 500 1080 Z" />
    <!-- Lekki Bridge Cable Stayed Towers right -->
    <path d="M 1600 1080 L 1640 820 L 1650 820 L 1690 1080 Z" />
    <path d="M 1645 830 L 1540 1080" stroke="#3b0764" stroke-width="3" />
    <path d="M 1645 870 L 1570 1080" stroke="#3b0764" stroke-width="2.5" />
    <path d="M 1645 910 L 1600 1080" stroke="#3b0764" stroke-width="2" />
    <path d="M 1645 830 L 1750 1080" stroke="#3b0764" stroke-width="3" />
    <path d="M 1645 870 L 1720 1080" stroke="#3b0764" stroke-width="2.5" />
    <path d="M 1645 910 L 1690 1080" stroke="#3b0764" stroke-width="2" />
    <!-- Center Civic Domes & Trees -->
    <circle cx="960" cy="1060" r="140" />
    <circle cx="1060" cy="1080" r="110" />
    <circle cx="860" cy="1090" r="120" />
  </g>

  <!-- Playful Floating Game Sparkles, Stars, Confetti & Hearts (Free & Beautiful) -->
  <g opacity="0.55">
    <!-- Emerald Diamonds / Stars -->
    <path d="M 220 160 L 226 175 L 241 181 L 226 187 L 220 202 L 214 187 L 199 181 L 214 175 Z" fill="#10b981" />
    <path d="M 1720 190 L 1728 210 L 1748 218 L 1728 226 L 1720 246 L 1712 226 L 1692 218 L 1712 210 Z" fill="#10b981" opacity="0.8" />
    <path d="M 780 110 L 784 120 L 794 124 L 784 128 L 780 138 L 776 128 L 766 124 L 776 120 Z" fill="#10b981" />
    <path d="M 1240 680 L 1247 697 L 1264 704 L 1247 711 L 1240 728 L 1233 711 L 1216 704 L 1233 697 Z" fill="#10b981" />

    <!-- Golden Stars / Coins -->
    <path d="M 460 220 L 467 236 L 483 243 L 467 250 L 460 266 L 453 250 L 437 243 L 453 236 Z" fill="#f59e0b" />
    <path d="M 1480 340 L 1486 354 L 1500 360 L 1486 366 L 1480 380 L 1474 366 L 1460 360 L 1474 354 Z" fill="#f59e0b" />
    <circle cx="340" cy="460" r="6" fill="#f59e0b" opacity="0.7" />
    <circle cx="1810" cy="520" r="8" fill="#f59e0b" opacity="0.6" />
    <circle cx="920" cy="220" r="5" fill="#f59e0b" opacity="0.7" />

    <!-- Purple & Pink Confetti Hearts & Bursts -->
    <path d="M 1120 180 C 1120 174, 1124 170, 1129 170 C 1133 170, 1136 173, 1138 176 C 1140 173, 1143 170, 1147 170 C 1152 170, 1156 174, 1156 180 C 1156 188, 1146 195, 1138 200 C 1130 195, 1120 188, 1120 180 Z" fill="#e040fb" opacity="0.6" />
    <path d="M 640 580 C 640 574, 644 570, 649 570 C 653 570, 656 573, 658 576 C 660 573, 663 570, 667 570 C 672 570, 676 574, 676 580 C 676 588, 666 595, 658 600 C 650 595, 640 588, 640 580 Z" fill="#a855f7" opacity="0.7" />
    <path d="M 1600 680 C 1600 674, 1604 670, 1609 670 C 1613 670, 1616 673, 1618 676 C 1620 673, 1623 670, 1627 670 C 1632 670, 1636 674, 1636 680 C 1636 688, 1626 695, 1618 700 C 1610 695, 1600 688, 1600 680 Z" fill="#ec4899" opacity="0.65" />

    <!-- Joyful Confetti Slips (tilted rectangles) -->
    <rect x="290" y="320" width="14" height="6" rx="3" transform="rotate(25 290 320)" fill="#10b981" />
    <rect x="850" y="380" width="16" height="7" rx="3.5" transform="rotate(-35 850 380)" fill="#8b2fc9" />
    <rect x="1350" y="160" width="12" height="5" rx="2.5" transform="rotate(45 1350 160)" fill="#f59e0b" />
    <rect x="1680" y="420" width="15" height="6" rx="3" transform="rotate(-20 1680 420)" fill="#e040fb" />
    <rect x="520" y="740" width="14" height="6" rx="3" transform="rotate(15 520 740)" fill="#10b981" />
    <rect x="1100" y="820" width="16" height="7" rx="3.5" transform="rotate(-40 1100 820)" fill="#f59e0b" />
    <rect x="180" y="650" width="12" height="5" rx="2.5" transform="rotate(30 180 650)" fill="#a855f7" />
  </g>
</svg>
